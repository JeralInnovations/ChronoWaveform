name: Compile firmware

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  nice-nano:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install adafruit-nrfutil (DFU packaging tool the core invokes)
        run: pip install adafruit-nrfutil

      - name: Install nice!nano v2 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/JeralInnovations/nicenano-v2-arduino/master/package_nicenano_index.json
          arduino-cli core update-index
          arduino-cli core install nicenano:nrf52@2.0.1

      - name: Compile nice!nano sketch
        run: |
          arduino-cli compile \
            --fqbn nicenano:nrf52:nicenanov2pf \
            firmware/ChronographNiceNano

  xiao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install adafruit-nrfutil (DFU packaging tool the core invokes)
        run: pip install adafruit-nrfutil

      - name: Install Seeed nRF52 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://files.seeedstudio.com/arduino/package_seeeduino_boards_index.json
          arduino-cli core update-index
          arduino-cli core install Seeeduino:nrf52@1.1.13

      - name: Compile XIAO sketch
        run: |
          arduino-cli compile \
            --fqbn Seeeduino:nrf52:xiaonRF52840 \
            firmware/ChronographXiao
