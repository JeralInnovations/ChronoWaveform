name: Build APK

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Test, lint and build APKs
        run: gradle -p android testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-validation-reports
          path: |
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/reports/lint-results-debug.*

      - uses: actions/upload-artifact@v4
        with:
          name: chrono-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: chrono-release-unsigned-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk

      # Release APKs must use the SAME protected key on every build. Fresh CI
      # debug keys force uninstall/reinstall and destroy the private library.
      - name: Prepare persistent release signing
        id: signing
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.CHRONO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No persistent signing key configured; public release skipped. See docs/STORAGE_AND_UPDATES.md."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/chrono.jks"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Build signed update
        if: steps.signing.outputs.ready == 'true'
        env:
          CHRONO_KEYSTORE_FILE: ${{ runner.temp }}/chrono.jks
          CHRONO_KEYSTORE_PASSWORD: ${{ secrets.CHRONO_KEYSTORE_PASSWORD }}
          CHRONO_KEY_ALIAS: ${{ secrets.CHRONO_KEY_ALIAS }}
          CHRONO_KEY_PASSWORD: ${{ secrets.CHRONO_KEY_PASSWORD }}
        run: gradle -p android assembleRelease

      - name: Publish signed update
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create latest android/app/build/outputs/apk/release/app-release.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Latest signed app build" \
            --notes "Signed APK. Read docs/STORAGE_AND_UPDATES.md before migrating from older debug builds." \
          || gh release upload latest android/app/build/outputs/apk/release/app-release.apk \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/chrono.jks"
